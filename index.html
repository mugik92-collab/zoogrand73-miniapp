<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ZooGrand73 — мини-магазин</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body { font-family: Arial, sans-serif; background:#f4f6f8; margin:0; padding:16px }
.card { background:#fff; border-radius:16px; padding:16px; margin-bottom:16px }
h1,h2 { margin:0 0 10px }
button {
  width:100%; padding:14px; margin-top:10px;
  border:none; border-radius:12px;
  background:#2f80ed; color:#fff; font-size:16px
}
.secondary { background:#27ae60 }
input, select {
  width:100%; padding:10px; margin-top:6px;
  border-radius:10px; border:1px solid #ccc
}
.hidden { display:none }
.price { font-weight:bold; font-size:18px; margin-top:10px }
</style>
</head>

<body>

<h1>🐾 ZooGrand73</h1>
<p>Передержка собак • как дома • с заботой</p>

<!-- QUIZ -->
<div class="card" id="quiz">
  <h2>🧠 Подбор услуги за 30 секунд</h2>

  <p>Размер собаки</p>
  <button onclick="setSize('Маленькая',800)">До 10 кг</button>
  <button onclick="setSize('Средняя',1200)">10–25 кг</button>
  <button onclick="setSize('Большая',1800)">25+ кг</button>

  <div id="step2" class="hidden">
    <p>Есть ли агрессия?</p>
    <button onclick="setAggression('Нет')">Нет</button>
    <button onclick="setAggression('Да')">Да</button>
  </div>

  <div id="step3" class="hidden">
    <p>Даты передержки</p>
    <input type="date" id="start">
    <input type="date" id="end">
    <input type="tel" id="phone" placeholder="Телефон">
    <button class="secondary" onclick="finishQuiz()">Рассчитать 💰</button>
  </div>
</div>

<!-- RESULT -->
<div class="card hidden" id="result">
  <h2>🐶 Ваш вариант</h2>
  <p id="info"></p>
  <p class="price" id="total"></p>
  <button onclick="sendOrder()">Забронировать 🐾</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let order = { size:'', price:0, aggression:'', start:'', end:'', days:0, total:0, phone:'' };

function setSize(size, price){
  order.size = size;
  order.price = price;
  document.getElementById('step2').classList.remove('hidden');
}

function setAggression(val){
  order.aggression = val;
  document.getElementById('step3').classList.remove('hidden');
}

function finishQuiz(){
  order.start = start.value;
  order.end = end.value;
  order.phone = phone.value;

  if(!order.start || !order.end || !order.phone){
    alert('Заполните всё'); return;
  }

  const d1 = new Date(order.start)

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ZooGrand73 🐾</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --green:#1f7a63;
  --bg:#f6f3ee;
  --brown:#5a4634;
  --accent:#f2c94c;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--brown);
}

.container{max-width:420px;margin:auto;padding:16px}
.card{
  background:#fff;
  border-radius:20px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
}

h1,h2{color:var(--green);margin:0 0 10px}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  background:var(--green);
  color:#fff;
  font-size:16px;
  margin-top:8px;
}
.secondary{background:var(--accent);color:#000}
.hidden{display:none}
input{width:100%;padding:10px;border-radius:12px;border:1px solid #ccc;margin-top:6px}
.option{margin-bottom:8px}
</style>
</head>

<body>
<div class="container">

<!-- HEADER -->
<div class="card">
<h1>🐾 ZooGrand73</h1>
<p>Передержка • забота • вкусняшки</p>
</div>

<!-- КВИЗ ПЕРЕДЕРЖКИ -->
<div class="card" id="stayQuiz">
<h2>🏡 Квиз передержки</h2>

<p><b>Размер собаки</b></p>
<button onclick="stay.size='До 5 кг'; stay.price=600; nextStay(1)">До 5 кг</button>
<button onclick="stay.size='5–10 кг'; stay.price=900; nextStay(1)">5–10 кг</button>
<button onclick="stay.size='10–25 кг'; stay.price=1200; nextStay(1)">10–25 кг</button>
<button onclick="stay.size='25+ кг'; stay.price=1800; nextStay(1)">25+ кг</button>

<div id="stayStep2" class="hidden">
<p><b>Есть агрессия?</b></p>
<button onclick="stay.aggression='Нет'; nextStay(2)">Нет</button>
<button onclick="stay.aggression='Да'; nextStay(2)">Да</button>
</div>

<div id="stayStep3" class="hidden">
<p><b>Даты</b></p>
<label>Заезд</label>
<input type="date" id="start">
<label>Выезд</label>
<input type="date" id="end">
<button class="secondary" onclick="finishStay()">Добавить в корзину</button>
</div>
</div>

<!-- КВИЗ ВКУСНЯШЕК -->
<div class="card" id="foodQuiz">
<h2>🍖 Квиз вкусняшек</h2>

<p><b>Тип</b></p>
<button onclick="food.type='Мясные'">🥩 Мясные</button>
<button onclick="food.type='Сушёные'">🦴 Сушёные</button>

<p><b>Упаковка</b></p>
<button onclick="food.pack='200 г'; food.price=300">200 г — 300 ₽</button>
<button onclick="food.pack='500 г'; food.price=500">500 г — 500 ₽</button>

<p><b>Количество</b></p>
<input type="number" min="1" value="1" id="foodQty">

<button class="secondary" onclick="addFood()">Добавить в корзину</button>
</div>

<!-- КОРЗИНА -->
<div class="card hidden" id="cart">
<h2>🧺 Корзина</h2>
<p id="cartList"></p>
<p><b id="total"></b></p>

<button onclick="sendOrder()">📩 Отправить заявку</button>
<button class="secondary" onclick="call()">📞 Позвонить</button>
</div>

</div>

<script>
const tg = Telegram.WebApp;
tg.expand();

let cart = [];
let sum = 0;

let stay = {};
let food = {};

function nextStay(step){
  if(step===1) document.getElementById('stayStep2').classList.remove('hidden');
  if(step===2) document.getElementById('stayStep3').classList.remove('hidden');
}

function finishStay(){
  const s = new Date(start.value);
  const e = new Date(end.value);
  const days = (e-s)/(1000*60*60*24);
  if(days<=0){alert("Неверные даты");return;}
  const price = days*stay.price;
  cart.push(`🏡 Передержка (${stay.size}, ${days} дн.) — ${price} ₽`);
  sum += price;
  showCart();
}

function addFood(){
  const q = +foodQty.value;
  if(!food.type || !food.pack){alert("Выберите всё");return;}
  const price = food.price*q;
  cart.push(`🍖 ${food.type}, ${food.pack} × ${q} — ${price} ₽`);
  sum += price;
  showCart();
}

function showCart(){
  cartList.innerHTML = cart.join("<br>");
  total.innerText = "Итого: "+sum+" ₽";
  cart.classList.remove('hidden');
}

function sendOrder(){
  const text =
`🐾 Заявка ZooGrand73

${cart.join("\n")}

💰 Итого: ${sum} ₽

📞 Клиент ждёт звонка`;
  tg.sendData(text);
  alert("✅ Заявка отправлена!");
}

function call(){
  location.href="tel:+79991901089";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ZooGrand73 — бронирование</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: linear-gradient(135deg, #eaf2ff, #f7faff);
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    h1, h2 { margin-top: 0; }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      font-size: 16px;
      border: none;
      border-radius: 14px;
      background: #2f80ed;
      color: #fff;
      cursor: pointer;
    }
    button.secondary { background: #27ae60; }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    .hidden { display: none; }
    .hint { color: #666; font-size: 14px; }
  </style>
</head>

<body>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  let order = {
    size: "",
    price: 0,
    aggression: "",
    start: "",
    end: "",
    days: 0,
    total: 0,
    phone: ""
  };
</script>

<div class="card" id="step1">
  <h1>🐾 ZooGrand73</h1>
  <p class="hint">Подберём передержку за 30 секунд</p>
  <h2>Размер собаки</h2>
  <button onclick="setSize('До 5 кг',600)">До 5 кг</button>
  <button onclick="setSize('5–10 кг',900)">5–10 кг</button>
  <button onclick="setSize('10–25 кг',1200)">10–25 кг</button>
  <button onclick="setSize('25+ кг',1800)">25+ кг</button>
</div>

<div class="card hidden" id="step2">
  <h2>Есть агрессия?</h2>
  <button onclick="setAggression('Нет')">Нет</button>
  <button onclick="setAggression('Да')">Да</button>
</div>

<div class="card hidden" id="step3">
  <h2>📅 Даты передержки</h2>
  <label>Заезд</label>
  <input type="date" id="start">
  <label>Выезд</label>
  <input type="date" id="end">
  <button class="secondary" onclick="finish()">Далее</button>
</div>

<div class="card hidden" id="step4">
  <h2>📞 Контактный телефон</h2>
  <input type="tel" id="phone" placeholder="+7 999 123-45-67">
  <button class="secondary" onclick="finishPhone()">Показать итог</button>
</div>

<div class="card hidden" id="result">
  <h2>✅ Ваша заявка</h2>
  <p id="summary"></p>
  <h2 id="price"></h2>
  <button onclick="sendToBot()">🐾 Отправить заявку</button>
</div>

<script>
  function setSize(size, price) {
    order.size = size;
    order.price = price;
    step1.classList.add("hidden");
    step2.classList.remove("hidden");
  }

  function setAggression(val) {
    order.aggression = val;
    step2.classList.add("hidden");
    step3.classList.remove("hidden");
  }

  function finish() {
    order.start = start.value;
    order.end = end.value;
    const days = (new Date(order.end) - new Date(order.start)) / 86400000;
    if (days <= 0) return alert("Проверьте даты");
    order.days = days;
    order.total = days * order.price;
    step3.classList.add("hidden");
    step4.classList.remove("hidden");
  }

  function finishPhone() {
    order.phone = phone.value;
    if (!order.phone) return alert("Введите телефон");
    step4.classList.add("hidden");
    result.classList.remove("hidden");
    summary.innerHTML = `
      🐶 Размер: <b>${order.size}</b><br>
      ⚠️ Агрессия: <b>${order.aggression}</b><br>
      📅 ${order.start} → ${order.end} (${order.days} дн.)<br>
      📞 Телефон: <b>${order.phone}</b>
    `;
    price.innerText = `💰 Итого: ${order.total} ₽`;
  }

  function sendToBot() {
    Telegram.WebApp.sendData(JSON.stringify(order));
    Telegram.WebApp.close();
  }
</script>

</body>
</html>
